[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-harness"
version = "0.4.0"
description = "ALICE: Artificial Logic and Intelligence Computation Engine. Ücretsiz API modelleriyle çalışan, bilgisayarı yönetebilen ajan harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "prompt_toolkit>=3",
    "psutil>=5.9",
    "pypdf>=4",
    "pillow>=10",
    "tomli>=2; python_version < '3.11'",
    # Windows ekran okuma (OCR): ALICE ile hep gelsin (refleks ve ekran görevi ekrandaki yazıları okur)
    "winrt-Windows.Media.Ocr>=2; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2; sys_platform == 'win32'",
    # Ne çalıyor + çalan uygulamayı kontrol (Spotify, Sonora, tarayıcı...): Windows medya oturumları
    "winrt-Windows.Media.Control>=2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2; sys_platform == 'win32'",
]

[project.optional-dependencies]
computer = [
    "mss>=9",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pygetwindow>=0.0.9; sys_platform == 'win32' or sys_platform == 'darwin'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]
browser = ["playwright>=1.45"]
app = ["pywebview>=5.1; sys_platform == 'win32' or sys_platform == 'darwin'"]
core = ["pystray>=0.19"]
voice = ["sounddevice>=0.4.6", "pynput>=1.7", "webrtcvad-wheels>=2.0.11", "edge-tts>=7.0", "av>=12", "websockets>=13",
         "sherpa-onnx>=1.12"]
home = ["websockets>=13"]
# Timeline encryption on Linux/macOS (Windows uses DPAPI): key in the OS keyring, Fernet (AES).
timeline = ["keyring>=24; sys_platform != 'win32'", "cryptography>=42; sys_platform != 'win32'"]
# Resmi Claude API (console.anthropic.com anahtarıyla, [providers.anthropic])
claude = ["anthropic>=2.6"]
voice-local = ["faster-whisper>=1.0", "openwakeword>=0.6"]
# XTTS v2 (yerel, Kore sesini taklit eder). transformers 5 XTTS'i bozuyor.
voice-xtts = ["coqui-tts>=0.27", "transformers<5"]
all = ["alice-harness[computer,browser,app,core,voice,home,claude,timeline]"]
dev = ["pre-commit>=3", "pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "websockets>=13", "keyring>=24", "cryptography>=42"]

[project.scripts]
alice = "alice.cli:main"

[tool.setuptools.packages.find]
include = ["alice*"]

[tool.setuptools.package-data]
"alice.app" = ["static/*"]
"alice.sims" = ["*.lua", "checklists/*.md", "checklists/en/*.md"]
"alice.connect" = ["builtin/*.toml"]
"alice" = ["apps.toml", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test still running after 120 s prints every thread's stack, so a hang in CI shows where it is.
faulthandler_timeout = 120

[tool.ruff]
line-length = 120
target-version = "py310"
# Eval fixtures contain deliberate bugs for the agent to fix (evals/README.md).
extend-exclude = ["evals/tasks/*/repo"]

[tool.ruff.lint]
# Yalnız gerçek hata yakalayan kurallar: sözdizimi, tanımsız ad, kullanılmayan import/değişken,
# bugbear (döngü değişkeni kapanışı, değiştirilebilir varsayılan...), çıplak except, pylint hataları,
# referanssız asyncio görevi, örtük Optional.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B", "E722", "PLE", "RUF006", "RUF013"]
# B905 (zip strict=) gürültü: uzunluklar zaten denetleniyor.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"alice/**/__init__.py" = ["F401"]

[tool.pyright]
# Type checking, one package at a time (#229). CI runs `pyright`; add a package here once it passes.
include = ["alice/core"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
