# Spotify Web API (OAuth2 + PKCE, client secret gerekmez).
# 1) developer.spotify.com/dashboard → Create app
# 2) Add exactly this as the Redirect URI:  http://127.0.0.1:8721/callback
# 3) Write the Client ID into ~/.alice/.env as SPOTIFY_CLIENT_ID=...
# 4) alice connect spotify
name = "spotify"
title = "Spotify"
description = "Music: find out what is playing, play/pause, next track, search, device choice, playlists."
base_url = "https://api.spotify.com/v1"
keywords = "spotify|müzik|şarkı|parça|çal|duraklat|playlist|music|song|play|pause"
docs = "https://developer.spotify.com/documentation/web-api"

[auth]
kind = "oauth2"
client_id_env = "SPOTIFY_CLIENT_ID"
authorize_url = "https://accounts.spotify.com/authorize"
token_url = "https://accounts.spotify.com/api/token"
pkce = true
redirect_port = 8721   # Spotify wants a registered address; a random port won't do
scopes = ["user-read-playback-state", "user-modify-playback-state", "user-read-currently-playing",
          "playlist-read-private"]
help = "developer.spotify.com/dashboard → Create app → write the Client ID into ~/.alice/.env as SPOTIFY_CLIENT_ID"

[actions.now_playing]
summary = "The track playing now"
path = "/me/player/currently-playing"
fields = ["item.name", "item.artists.0.name", "item.album.name", "is_playing", "progress_ms"]

[actions.search]
summary = "Search tracks/artists/albums (the uri is needed to play)"
cache_seconds = 60
path = "/search"
query = { limit = "8" }
pick = "tracks.items"
fields = ["name", "artists.0.name", "album.name", "uri"]
[actions.search.params.q]
type = "string"
required = true
description = "Arama ifadesi"
[actions.search.params.type]
type = "string"
description = "track | artist | album | playlist (default: track)"
enum = ["track", "artist", "album", "playlist"]
default = "track"

[actions.play]
summary = "Play/resume; plays the given tracks when uris is given"
method = "PUT"
path = "/me/player/play"
writes = true
[actions.play.params.uris]
type = "array"
into = "body"
description = "Track uris to play, e.g. spotify:track:... (from a search result)"
[actions.play.params.device_id]
type = "string"
into = "query"
description = "Hangi cihazda (devices eyleminden)"

[actions.pause]
summary = "Duraklat"
method = "PUT"
path = "/me/player/pause"
writes = true

[actions.next]
summary = "Next track"
method = "POST"
path = "/me/player/next"
writes = true

[actions.previous]
summary = "Previous track"
method = "POST"
path = "/me/player/previous"
writes = true

[actions.volume]
summary = "Ses seviyesini ayarla (0-100)"
method = "PUT"
path = "/me/player/volume"
writes = true
[actions.volume.params.volume_percent]
type = "integer"
required = true
into = "query"
description = "0-100"

[actions.devices]
summary = "Devices Spotify can play on (phone, computer, speaker)"
cache_seconds = 60
path = "/me/player/devices"
pick = "devices"
fields = ["name", "type", "is_active", "id"]

[actions.playlists]
summary = "Your playlists"
cache_seconds = 60
path = "/me/playlists"
query = { limit = "20" }
pick = "items"
fields = ["name", "tracks.total", "uri"]
limit = 20
