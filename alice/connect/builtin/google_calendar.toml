# Google Calendar (OAuth2 + PKCE, Google desktop app).
# 1) console.cloud.google.com → new project → enable "Google Calendar API"
# 2) OAuth consent screen: External, add yourself to "Test users"
# 3) Credentials → Create credentials → OAuth client ID → Application type: Desktop app
# 4) Write GOOGLE_CLIENT_ID=... and GOOGLE_CLIENT_SECRET=... into ~/.alice/.env (in a desktop app this "secret"
#    isn't a real secret, but Google asks for it when getting a token)
# 5) alice connect google_calendar
name = "google_calendar"
title = "Google Calendar"
description = "Calendar: upcoming events (exam, match, appointment, meeting), search, adding events in plain words ('Friday 15:00 dentist'), deleting."
base_url = "https://www.googleapis.com/calendar/v3"
keywords = "takvim|takvimim|takvime|randevu|toplantı|etkinlik|ajanda|calendar|appointment|meeting|event|schedule|bu hafta ne var|yarın ne var|programım"
docs = "https://developers.google.com/calendar/api/v3/reference"

[auth]
kind = "oauth2"
client_id_env = "GOOGLE_CLIENT_ID"
client_secret_env = "GOOGLE_CLIENT_SECRET"
authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
pkce = true
scopes = ["https://www.googleapis.com/auth/calendar.events", "https://www.googleapis.com/auth/calendar.readonly"]
extra_authorize = { access_type = "offline", prompt = "consent" }   # get a refresh token: don't ask for permission every day
help = "console.cloud.google.com → Calendar API → OAuth client (Desktop app); GOOGLE_CLIENT_ID ve GOOGLE_CLIENT_SECRET'i ~/.alice/.env'e yaz"

[actions.upcoming]
summary = "Events in a time range (in order). timeMin/timeMax are RFC3339, e.g. 2026-10-22T00:00:00+03:00"
path = "/calendars/{calendarId}/events"
query = { singleEvents = "true", orderBy = "startTime" }
pick = "items"
fields = ["summary", "start.dateTime", "start.date", "end.dateTime", "location", "id"]
limit = 25
[actions.upcoming.params.calendarId]
type = "string"
description = "Calendar id; primary for the main calendar"
default = "primary"
into = "path"
[actions.upcoming.params.timeMin]
type = "string"
required = true
description = "Start, RFC3339 (for today, today at 00:00 with the time zone)"
[actions.upcoming.params.timeMax]
type = "string"
description = "End, RFC3339 (empty: unlimited)"
[actions.upcoming.params.q]
type = "string"
description = "Text search in events, e.g. 'exam'"
[actions.upcoming.params.maxResults]
type = "integer"
description = "En fazla etkinlik"
default = 20

[actions.quick_add]
summary = "Add an event in plain words, e.g. 'Friday 15:00 dentist' or 'Dec 3 7pm match' (Google parses it)"
method = "POST"
path = "/calendars/{calendarId}/events/quickAdd"
writes = true
fields = ["summary", "start.dateTime", "start.date", "htmlLink", "id"]
[actions.quick_add.params.calendarId]
type = "string"
description = "Calendar id; primary for the main calendar"
default = "primary"
into = "path"
[actions.quick_add.params.text]
type = "string"
required = true
description = "Event text: what and when (write the date and time explicitly)"
into = "query"

[actions.delete]
summary = "Delete the event (the id is from the upcoming output)"
method = "DELETE"
path = "/calendars/{calendarId}/events/{eventId}"
writes = true
[actions.delete.params.calendarId]
type = "string"
description = "Calendar id; primary for the main calendar"
default = "primary"
into = "path"
[actions.delete.params.eventId]
type = "string"
required = true
description = "Event id"
into = "path"

[actions.calendars]
summary = "List of calendars (with their ids)"
path = "/users/me/calendarList"
cache_seconds = 600
pick = "items"
fields = ["summary", "id", "primary"]
