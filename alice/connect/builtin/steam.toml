# Steam Web API. Key: https://steamcommunity.com/dev/apikey (free, an account is enough)
name = "steam"
title = "Steam"
description = "Steam library, playtime, friend list and player status. Not for launching games: open steam://rungameid/<appid> with the windows tool."
base_url = "https://api.steampowered.com"
keywords = "steam|oyun|kütüphane|arkadaş|oynadım|saat|game|library|friends|playtime|played"
docs = "https://steamcommunity.com/dev"

[auth]
kind = "api_key"
env = "STEAM_API_KEY"
place = "query"
name = "key"
help = "https://steamcommunity.com/dev/apikey"

[actions.library]
summary = "Games in the library and total playtime (playtime in minutes)"
cache_seconds = 300
path = "/IPlayerService/GetOwnedGames/v1/"
query = { include_appinfo = "1", include_played_free_games = "1", format = "json" }
pick = "response.games"
fields = ["name", "playtime_forever", "appid"]
limit = 40
[actions.library.params.steamid]
type = "string"
required = true
description = "SteamID64 (profile number). If unknown, use resolve_vanity first."

[actions.recent]
summary = "Son iki haftada oynanan oyunlar"
cache_seconds = 120
path = "/IPlayerService/GetRecentlyPlayedGames/v1/"
pick = "response.games"
fields = ["name", "playtime_2weeks", "playtime_forever", "appid"]
[actions.recent.params.steamid]
type = "string"
required = true
description = "SteamID64"

[actions.profile]
summary = "Player status: online or not, which game right now"
path = "/ISteamUser/GetPlayerSummaries/v2/"
pick = "response.players"
fields = ["personaname", "personastate", "gameextrainfo", "lastlogoff"]
[actions.profile.params.steamids]
type = "string"
required = true
description = "SteamID64, several can be given separated by commas"

[actions.friends]
summary = "Friend list (SteamID64s; use profile for their names)"
cache_seconds = 300
path = "/ISteamUser/GetFriendList/v1/"
query = { relationship = "friend" }
pick = "friendslist.friends"
fields = ["steamid", "friend_since"]
limit = 50
[actions.friends.params.steamid]
type = "string"
required = true
description = "SteamID64"

[actions.resolve_vanity]
summary = "Find the SteamID64 from a profile name (vanity URL)"
cache_seconds = 300
path = "/ISteamUser/ResolveVanityURL/v1/"
pick = "response"
fields = ["steamid", "success", "message"]
[actions.resolve_vanity.params.vanityurl]
type = "string"
required = true
description = "steamcommunity.com/id/<buradaki ad>"

[actions.news]
summary = "News/patch notes of a game"
cache_seconds = 300
path = "/ISteamNews/GetNewsForApp/v2/"
query = { count = "5", maxlength = "600" }
pick = "appnews.newsitems"
fields = ["title", "date", "url"]
limit = 5
[actions.news.params.appid]
type = "integer"
required = true
description = "Oyunun Steam appid'si (library sonucunda var)"
