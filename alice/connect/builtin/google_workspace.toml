# Google Drive, Docs and Sheets (with a single Google sign-in). The same OAuth client as Google Calendar is used.
# 1) console.cloud.google.com → in the project you opened for Calendar, enable "Google Drive API", "Google Docs API" and
#    "Google Sheets API"
# 2) If GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are already in ~/.alice/.env, nothing more is needed
# 3) alice connect google_workspace   (or System → Connections → Google Workspace → Connect)
name = "google_workspace"
title = "Google Drive, Docs ve Sheets"
description = "Search and read files on Drive (Docs as text, Sheets as CSV); create a Google Docs document and append text to it; create a Google Sheets spreadsheet, read ranges, append rows and update cells."
base_url = "https://www.googleapis.com"
keywords = "google drive|drive'da|drive'daki|google docs|google doküman|google belge|dokümanım|google sheets|e-?tablo|spreadsheet|sheets|tablomu|tabloya|google tablo|document|my doc"
docs = "https://developers.google.com/workspace"

[auth]
kind = "oauth2"
client_id_env = "GOOGLE_CLIENT_ID"
client_secret_env = "GOOGLE_CLIENT_SECRET"
authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
pkce = true
scopes = ["https://www.googleapis.com/auth/drive.readonly", "https://www.googleapis.com/auth/documents",
          "https://www.googleapis.com/auth/spreadsheets"]
extra_authorize = { access_type = "offline", prompt = "consent" }
help = "The same Google OAuth client as Calendar; enable the Drive, Docs and Sheets APIs in the project"

# ------------------------------------------------------------------------------------------------ Drive
[actions.drive_search]
summary = "Search files on Drive. q is the Drive query language: e.g. name contains 'report', mimeType = 'application/vnd.google-apps.document' (Docs), 'application/vnd.google-apps.spreadsheet' (Sheets), modifiedTime > '2026-11-01T00:00:00'"
path = "/drive/v3/files"
query = { fields = "files(id,name,mimeType,modifiedTime,webViewLink)", orderBy = "modifiedTime desc" }
pick = "files"
fields = ["name", "id", "mimeType", "modifiedTime", "webViewLink"]
limit = 25
[actions.drive_search.params.q]
type = "string"
description = "Drive query; empty: recently changed files. To leave out trashed ones: trashed = false"
[actions.drive_search.params.pageSize]
type = "integer"
description = "En fazla dosya"
default = 20

[actions.drive_read]
summary = "Read a Google Docs/Sheets/Slides file as text (fileId from drive_search). Docs: text/plain, Sheets: text/csv (first sheet), Slides: text/plain"
path = "/drive/v3/files/{fileId}/export"
[actions.drive_read.params.fileId]
type = "string"
required = true
description = "File id"
[actions.drive_read.params.mimeType]
type = "string"
description = "Export format"
enum = ["text/plain", "text/csv", "text/markdown", "text/html"]
default = "text/plain"

# ------------------------------------------------------------------------------------------------- Docs
[actions.docs_create]
summary = "Create a new Google Docs document (empty); add content afterwards with docs_append. The address with the returned documentId: https://docs.google.com/document/d/<id>/edit"
method = "POST"
path = "https://docs.googleapis.com/v1/documents"
writes = true
body = { title = "{title}" }
fields = ["documentId", "title"]
[actions.docs_create.params.title]
type = "string"
required = true
description = "Document title"
into = "template"

[actions.docs_append]
summary = "Append plain text to the end of a Google Docs document (line breaks are kept)"
method = "POST"
path = "https://docs.googleapis.com/v1/documents/{documentId}:batchUpdate"
writes = true
body = { requests = [{ insertText = { endOfSegmentLocation = {}, text = "{text}" } }] }
[actions.docs_append.params.documentId]
type = "string"
required = true
description = "Document id (from drive_search or docs_create)"
into = "path"
[actions.docs_append.params.text]
type = "string"
required = true
description = "Text to append; put '\\n' at the start to begin a new paragraph"
into = "template"

# ------------------------------------------------------------------------------------------------ Sheets
[actions.sheets_create]
summary = "Create a new Google Sheets spreadsheet. It opens with the returned spreadsheetUrl."
method = "POST"
path = "https://sheets.googleapis.com/v4/spreadsheets"
writes = true
body = { properties = { title = "{title}" } }
fields = ["spreadsheetId", "spreadsheetUrl"]
[actions.sheets_create.params.title]
type = "string"
required = true
description = "Spreadsheet title"
into = "template"

[actions.sheets_read]
summary = "Read a range from the spreadsheet, e.g. Sheet1!A1:F50 (sheet name only: the whole sheet)"
path = "https://sheets.googleapis.com/v4/spreadsheets/{spreadsheetId}/values/{range}"
pick = "values"
limit = 200
[actions.sheets_read.params.spreadsheetId]
type = "string"
required = true
description = "Spreadsheet id"
[actions.sheets_read.params.range]
type = "string"
required = true
description = "A1 range, e.g. Sheet1!A1:F50"

[actions.sheets_append]
summary = "Append row(s) to the end of the spreadsheet; values are interpreted as if the user typed them (number, date, formula)"
method = "POST"
path = "https://sheets.googleapis.com/v4/spreadsheets/{spreadsheetId}/values/{range}:append"
query = { valueInputOption = "USER_ENTERED", insertDataOption = "INSERT_ROWS" }
writes = true
fields = ["updates.updatedRange", "updates.updatedRows"]
[actions.sheets_append.params.spreadsheetId]
type = "string"
required = true
description = "Spreadsheet id"
[actions.sheets_append.params.range]
type = "string"
required = true
description = "Sheet/range to append to, e.g. Sheet1!A1"
[actions.sheets_append.params.values]
type = "array"
required = true
description = "Rows: each row is a list, e.g. [[\"Ann\", 12], [\"Bob\", 9]]"
into = "body"

[actions.sheets_update]
summary = "Replace the cells in the range with the given values, e.g. Sheet1!B2:C3"
method = "PUT"
path = "https://sheets.googleapis.com/v4/spreadsheets/{spreadsheetId}/values/{range}"
query = { valueInputOption = "USER_ENTERED" }
writes = true
fields = ["updatedRange", "updatedCells"]
[actions.sheets_update.params.spreadsheetId]
type = "string"
required = true
description = "Spreadsheet id"
[actions.sheets_update.params.range]
type = "string"
required = true
description = "Range to replace"
[actions.sheets_update.params.values]
type = "array"
required = true
description = "Rows: each row is a list"
into = "body"
