# YouTube Data API v3. Key: https://console.cloud.google.com → YouTube Data API v3 → API key (free quota)
name = "youtube_api"
title = "YouTube"
description = "Search YouTube videos/channels and get video info (views, duration). To open/play a video use the youtube or browser tool; this is the data side."
base_url = "https://www.googleapis.com/youtube/v3"
keywords = "youtube|video|kanal|izlenme|abone|channel|views|subscribers"
docs = "https://developers.google.com/youtube/v3/getting-started"

[auth]
kind = "api_key"
env = "YOUTUBE_API_KEY"
place = "query"
name = "key"
help = "console.cloud.google.com → YouTube Data API v3 → Credentials → API key"

[actions.search]
summary = "Video, kanal ya da oynatma listesi ara"
cache_seconds = 300
path = "/search"
query = { part = "snippet", maxResults = "8" }
pick = "items"
fields = ["snippet.title", "snippet.channelTitle", "id.videoId", "snippet.publishedAt"]
[actions.search.params.q]
type = "string"
required = true
description = "Arama ifadesi"
[actions.search.params.type]
type = "string"
description = "video | channel | playlist (default: all)"
enum = ["video", "channel", "playlist"]
[actions.search.params.maxResults]
type = "integer"
description = "How many results (1-25)"

[actions.video]
summary = "Video details: title, channel, views, likes, duration"
cache_seconds = 300
path = "/videos"
query = { part = "snippet,statistics,contentDetails" }
pick = "items"
fields = ["snippet.title", "snippet.channelTitle", "statistics.viewCount", "statistics.likeCount", "contentDetails.duration"]
[actions.video.params.id]
type = "string"
required = true
description = "Video id (after watch?v=), several can be given separated by commas"

[actions.channel]
summary = "Channel info: subscribers, video count, total views"
cache_seconds = 300
path = "/channels"
query = { part = "snippet,statistics" }
pick = "items"
fields = ["snippet.title", "statistics.subscriberCount", "statistics.videoCount", "statistics.viewCount"]
[actions.channel.params.forHandle]
type = "string"
description = "@kullaniciadi"
[actions.channel.params.id]
type = "string"
description = "Channel id (starts with UC...)"

[actions.comments]
summary = "The most liked comments of a video"
cache_seconds = 300
path = "/commentThreads"
query = { part = "snippet", order = "relevance", maxResults = "10" }
pick = "items"
fields = ["snippet.topLevelComment.snippet.authorDisplayName", "snippet.topLevelComment.snippet.textOriginal", "snippet.topLevelComment.snippet.likeCount"]
limit = 10
[actions.comments.params.videoId]
type = "string"
required = true
description = "Video id'si"
