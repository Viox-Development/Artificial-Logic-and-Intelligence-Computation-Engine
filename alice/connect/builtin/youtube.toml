# YouTube Data API v3. Anahtar: https://console.cloud.google.com → YouTube Data API v3 → API key (ücretsiz kota)
name = "youtube_api"
title = "YouTube"
description = "YouTube'da video/kanal arama ve video bilgisi (izlenme, süre). Video açmak/oynatmak için youtube ya da browser aracını kullan; burası veri tarafı."
base_url = "https://www.googleapis.com/youtube/v3"
keywords = "youtube|video|kanal|izlenme|abone"
docs = "https://developers.google.com/youtube/v3/getting-started"

[auth]
kind = "api_key"
env = "YOUTUBE_API_KEY"
place = "query"
name = "key"
help = "console.cloud.google.com → YouTube Data API v3 → Kimlik bilgileri → API anahtarı"

[actions.search]
summary = "Video, kanal ya da oynatma listesi ara"
path = "/search"
query = { part = "snippet", maxResults = "8" }
pick = "items"
fields = ["snippet.title", "snippet.channelTitle", "id.videoId", "snippet.publishedAt"]
[actions.search.params.q]
type = "string"
required = true
description = "Arama ifadesi"
[actions.search.params.type]
type = "string"
description = "video | channel | playlist (varsayılan hepsi)"
enum = ["video", "channel", "playlist"]
[actions.search.params.maxResults]
type = "integer"
description = "Kaç sonuç (1-25)"

[actions.video]
summary = "Video ayrıntısı: başlık, kanal, izlenme, beğeni, süre"
path = "/videos"
query = { part = "snippet,statistics,contentDetails" }
pick = "items"
fields = ["snippet.title", "snippet.channelTitle", "statistics.viewCount", "statistics.likeCount", "contentDetails.duration"]
[actions.video.params.id]
type = "string"
required = true
description = "Video id'si (watch?v= sonrası), virgülle birden fazla"

[actions.channel]
summary = "Kanal bilgisi: abone, video sayısı, toplam izlenme"
path = "/channels"
query = { part = "snippet,statistics" }
pick = "items"
fields = ["snippet.title", "statistics.subscriberCount", "statistics.videoCount", "statistics.viewCount"]
[actions.channel.params.forHandle]
type = "string"
description = "@kullaniciadi"
[actions.channel.params.id]
type = "string"
description = "Kanal id'si (UC... ile başlar)"

[actions.comments]
summary = "Bir videonun en çok beğenilen yorumları"
path = "/commentThreads"
query = { part = "snippet", order = "relevance", maxResults = "10" }
pick = "items"
fields = ["snippet.topLevelComment.snippet.authorDisplayName", "snippet.topLevelComment.snippet.textOriginal", "snippet.topLevelComment.snippet.likeCount"]
limit = 10
[actions.comments.params.videoId]
type = "string"
required = true
description = "Video id'si"
