<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="alice-token" content="{{TOKEN}}">
<title>ALICE</title>
<link rel="icon" href="/static/alice.png">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script src="/static/highlight.js"></script>
<script src="/static/app.js" defer></script>
<script src="/static/projects.js" defer></script>
<script src="/static/ui.js" defer></script>
<script src="/static/main.js" defer></script>
</head>
<body>
<div id="app" class="empty">
  <aside id="sidebar">
    <div class="side-top">
      <div class="brand"><img src="/static/alice.png" alt="Alice"><span>ALICE</span></div>
      <button class="icon-btn" id="collapseSide" title="Kenar çubuğunu gizle (Ctrl+B)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <button id="newChat" class="new-chat">
      <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span>
      Yeni sohbet
    </button>
    <label class="side-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></svg>
      <input id="sessSearch" type="text" placeholder="Sohbetlerde ara" spellcheck="false" autocomplete="off">
    </label>
    <div class="side-sec">
      <span>Projeler</span>
      <button class="icon-btn" id="newProject" title="Yeni proje: paralel çalışan ajan takımı">
        <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
      </button>
    </div>
    <nav id="projects"></nav>
    <nav id="sessions"></nav>
    <div class="side-foot">
      <button class="user-chip" id="settingsBtn" title="Modeller ve ayarlar">
        <span class="avatar" id="avatar">A</span>
        <span class="user-meta"><b id="userName">ALICE</b><small id="ver"></small></span>
        <svg viewBox="0 0 24 24" class="chev-ud"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
      </button>
    </div>
  </aside>

  <main>
    <header id="topbar">
      <button class="icon-btn" id="openSide" title="Kenar çubuğunu göster (Ctrl+B)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <button id="cwdBtn" class="cwd-chip" title="Çalışma klasörünü değiştir">
        <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>
        <span id="cwd">…</span>
      </button>
      <span id="branchChip" class="branch-chip" hidden title="Git dalı">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-11.2 7.3"/></svg>
        <span id="branch"></span>
      </span>
      <span class="grow"></span>
      <button id="paletteBtn" class="top-btn" title="Komut paleti (Ctrl+K)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></svg>
        <span>Ara</span><kbd>Ctrl K</kbd>
      </button>
      <button id="changesBtn" class="top-btn changes" hidden title="Bu oturumdaki değişiklikler">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6M12 11v6"/></svg>
        <span class="a" id="chA">+0</span><span class="d" id="chD">−0</span>
      </button>
      <button class="icon-btn" id="panelBtn" title="Yan paneli aç/kapat (Ctrl+J)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>
      </button>
    </header>

    <section id="projectView" hidden></section>

    <section id="scroller">
      <div id="hero">
        <div class="hero-mark"><img src="/static/alice.png" alt="Alice"></div>
        <h1 id="greeting">Merhaba</h1>
      </div>
      <div id="messages"></div>
    </section>

    <div id="dock">
      <div id="dockTop">
        <div id="update" hidden role="status">
          <svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4"/><path d="M5 18h14"/></svg>
          <span id="upText">Yeni sürüm hazır</span>
          <button id="upApply" class="up-btn">Güncelle ve yeniden başlat</button>
          <button id="upLater" class="up-btn ghost">Sonra</button>
        </div>
        <div id="conn" hidden role="status">ALICE'e bağlantı koptu, yeniden bağlanıyor…</div>
        <button id="jump" hidden title="En alta in">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </button>
      </div>
      <div id="team" hidden></div>
      <div id="queue"></div>
      <button id="planbar" hidden title="Planı yan panelde aç">
        <span class="pb-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="bg"/><circle cx="18" cy="18" r="15" class="fg" id="pbArc"/></svg></span>
        <span class="pb-count" id="pbCount">0/0</span>
        <span class="pb-text" id="pbText"></span>
        <span class="pb-next" id="pbNext"></span>
      </button>
      <div id="composerWrap">
        <div id="popup" hidden></div>
        <div id="composer">
          <div id="attachments"></div>
          <textarea id="input" rows="1" placeholder="ALICE'e bir iş ver…" spellcheck="false"></textarea>
          <div class="c-row">
            <button class="c-btn" id="attachBtn" title="Görsel ekle (yapıştırabilir ya da sürükleyebilirsin)">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="c-btn pill" id="modeBtn" title="İzin modu (Shift+Tab)">
              <svg viewBox="0 0 24 24" id="modeIcon"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
              <span id="modeLabel">Otomatik</span>
            </button>
            <span class="grow"></span>
            <button class="c-btn pill think" id="thinkBtn" title="Düşünme seviyesi">
              <svg viewBox="0 0 24 24" id="thinkIcon"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></svg>
              <span id="thinkLabel">düşünme</span>
              <svg viewBox="0 0 24 24" class="caret"><path d="M7 10l5 5 5-5"/></svg>
            </button>
            <button class="c-btn pill model" id="modelBtn" title="Model">
              <span id="modelLabel">model</span>
              <svg viewBox="0 0 24 24" class="caret"><path d="M7 10l5 5 5-5"/></svg>
            </button>
            <button id="sendBtn" title="Gönder (Enter)">
              <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
              <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>
      <div id="suggest">
        <button class="sg" data-text="Bu klasördeki projeyi incele ve ne yaptığını kısaca anlat">
          <svg viewBox="0 0 24 24"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/></svg>Kod</button>
        <button class="sg" data-text="Bilgisayarımın donanımını çıkar, RAM'i en çok kullanan programları göster">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Bilgisayar</button>
        <button class="sg" data-text="Ekrana bak ve şu an açık olan pencereleri söyle">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/></svg>Ekran</button>
        <button class="sg" data-text="Web'de araştır: ">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Araştır</button>
      </div>
      <div id="statusbar">
        <span id="stModel"></span>
        <span class="sep">·</span>
        <span id="stCtx" title="Context doluluğu, sınırda otomatik özetlenir"><i class="meter"><i></i></i><span></span></span>
        <span class="sep">·</span>
        <span id="stReq"></span>
        <span class="sep">·</span>
        <span id="stDec"></span>
        <span class="sep st-br">·</span>
        <span id="stBranch" class="st-br"></span>
        <span class="sep">·</span>
        <span id="stClock" title="Oturum süresi"></span>
      </div>
    </div>
  </main>

  <aside id="panel">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button class="tab" data-tab="plan">Plan</button>
        <button class="tab" data-tab="changes">Değişiklikler <span class="badge" id="chCount"></span></button>
        <button class="tab" data-tab="context">Bağlam</button>
      </div>
      <button class="icon-btn" id="panelClose" title="Kapat (Ctrl+J)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<div id="palette" hidden>
  <div class="pal">
    <div class="pal-in">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></svg>
      <input id="palInput" type="text" placeholder="Komut, sohbet ya da ayar ara…" spellcheck="false" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> gez</span><span><kbd>Enter</kbd> seç</span><span><kbd>Esc</kbd> kapat</span></div>
  </div>
</div>

<div id="menu" hidden></div>
<div id="overlay" hidden><div class="dialog" id="dialog"></div></div>
<div id="dropzone" hidden><div>Görseli bırak</div></div>
<div id="toast" hidden></div>
</body>
</html>
