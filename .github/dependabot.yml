# Weekly dependency updates, grouped so they arrive as a few pull requests instead of dozens.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned on purpose: coqui-tts (voice-xtts extra) breaks with transformers 5+.
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: monthly
    labels: ["dependencies", "relay"]
    groups:
      relay:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    labels: ["dependencies", "android"]
    groups:
      android:
        patterns: ["*"]
    ignore:
      # Major Gradle/AGP/AndroidX jumps need a manual SDK and build upgrade; they broke the APK build (#205).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.core:core"
        update-types: ["version-update:semver-minor"]
