name: Release notes

# Keeps a draft release with notes from merged pull requests. Publishing it stays a manual step: only maintainers can
# create v* tags. Run this workflow by hand with a header to put highlights above the notes; the next push to main
# drafts the notes again without it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      header:
        description: Markdown put above the generated notes (e.g. a Highlights section)
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          header: ${{ inputs.header }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
