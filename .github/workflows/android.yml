name: Android

# Telefon uygulamasını (android/) derler. main'e gelince APK ve sürüm bilgisi "android-apk" dalına konur (tek commit,
# her seferinde üstüne yazılır). Depo özel olduğu için telefon GitHub'dan indiremez: bilgisayardaki ALICE bu dalı çeker
# ve telefona yerel ağdan verir (alice/app/phone_apk.py); uygulama yeni sürümü görünce kendini günceller.
# İmza: Android bir uygulamayı ancak aynı anahtarla imzalanmış sürümle günceller. Anahtar depo gizli değişkenlerinde
# durur: ALICE_KEYSTORE_B64 (base64 .jks), ALICE_KEYSTORE_PASSWORD ve ALICE_KEY_ALIAS. Yoksa APK derlenir ama
# yayınlanmaz (her derlemede farklı bir anahtar olurdu, telefondaki uygulama güncellenemezdi).

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: İmza anahtarı
        env:
          KS_B64: ${{ secrets.ALICE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ALICE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ALICE_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/alice.jks"
            echo "ALICE_KEYSTORE=$RUNNER_TEMP/alice.jks" >> "$GITHUB_ENV"
            echo "ALICE_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ALICE_KEY_ALIAS=${KS_ALIAS:-alice}" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ALICE_KEYSTORE_B64 gizli değişkeni yok: APK geçici anahtarla imzalanıyor ve yayınlanmayacak."
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storetype JKS \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            echo "ALICE_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "ALICE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ALICE_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          fi
      - name: Derle
        run: ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk ALICE.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ALICE-apk
          path: android/ALICE.apk
      - name: Telefonlara yayınla (android-apk dalı)
        if: env.SIGNED == '1' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist" && cp ALICE.apk "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          SHA=$(sha256sum ALICE.apk | cut -d' ' -f1)
          printf '{"version_code": %s, "version_name": "0.2.%s", "sha256": "%s", "commit": "%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$SHA" "$GITHUB_SHA" > version.json
          git init -q -b android-apk
          git add ALICE.apk version.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ALICE.apk 0.2.$GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-apk
      - name: GitHub Releases'a yükle
        # Elle indirmek için de: her yayın bir sürüm (android-v0.2.N). "Latest" Windows kurulumunun sürümüdür
        # (windows.yml; en son APK oraya da eklenir). Telefonun kendi güncellemesi android-apk dalından gider.
        if: env.SIGNED == '1' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v0.2.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" ALICE.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "ALICE Android 0.2.$GITHUB_RUN_NUMBER" \
            --notes "Telefon uygulaması (imzalı APK). Kurulu uygulama kendini otomatik günceller; bu dosya elle kurmak için. Commit: $GITHUB_SHA"
          # "Latest" (windows) sürümündeki APK da yenilensin: windows.yml aynı anda çalışınca eski APK'yı
          # ekliyordu (7 Kasım: Latest'te 0.2.13 kaldı, kullanıcı düzeltmesiz sürümü indirdi).
          if gh release view windows --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload windows ALICE.apk --repo "$GITHUB_REPOSITORY" --clobber
          fi
