name: Android

# Builds the phone app (android/). Pull requests and manual runs only build it. A published vX.Y.Z release attaches
# ALICE.apk to that release and, when it is the latest release, also puts the APK and its version info on the
# "android-apk" branch (one commit, overwritten each time). Installed phones update from there: the PC's ALICE pulls
# that branch and serves the APK over the local network (alice/app/phone_apk.py). So phones, like the PC's stable
# update channel, only ever get released code, never an unreleased commit from main.
# Signing: Android updates an app only with a build signed by the same key. The key lives in the repo secrets
# ALICE_KEYSTORE_B64 (base64 .jks), ALICE_KEYSTORE_PASSWORD and ALICE_KEY_ALIAS. Without them the APK is built but not
# published (every build would have a different key and installed apps could not update).

on:
  release:
    types: [published]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the APK to (vX.Y.Z); empty = build only"
        required: false

concurrency:
  group: android-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check the tag
        if: env.TAG != ''
        working-directory: .
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ALICE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ALICE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ALICE_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/alice.jks"
            echo "ALICE_KEYSTORE=$RUNNER_TEMP/alice.jks" >> "$GITHUB_ENV"
            echo "ALICE_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ALICE_KEY_ALIAS=${KS_ALIAS:-alice}" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ALICE_KEYSTORE_B64 secret is not set: the APK is signed with a temporary key and will not be published."
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storetype JKS \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            echo "ALICE_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "ALICE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ALICE_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          fi
      - name: Derle
        run: ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk ALICE.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ALICE-apk
          path: android/ALICE.apk
      - name: Attach to the release
        if: env.SIGNED == '1' && env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ALICE.apk --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish to phones (android-apk branch)
        # Only for the latest release: rebuilding an older release by hand must not send phones back to old code.
        if: env.SIGNED == '1' && env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          if [ "$LATEST" != "$TAG" ]; then echo "$TAG is not the latest release ($LATEST): phones not updated"; exit 0; fi
          COMMIT=$(git rev-parse HEAD)
          mkdir -p "$RUNNER_TEMP/dist" && cp ALICE.apk "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          SHA=$(sha256sum ALICE.apk | cut -d' ' -f1)
          printf '{"version_code": %s, "version_name": "0.2.%s", "sha256": "%s", "commit": "%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$SHA" "$COMMIT" > version.json
          git init -q -b android-apk
          git add ALICE.apk version.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ALICE.apk 0.2.$GITHUB_RUN_NUMBER ($TAG)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-apk
