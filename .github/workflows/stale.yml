name: Stale

# Nudges inactive issues and pull requests, then closes them if nobody responds. Security, pinned, and
# accepted items are never touched.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,accepted,good first issue,help wanted,tracking,blocked,in-progress,priority: high"
          exempt-pr-labels: "pinned,security,blocked,in-progress"
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days unless there is new activity.
          stale-pr-message: >
            This pull request has had no activity for 30 days. It will be closed in 14 days unless it is updated.
