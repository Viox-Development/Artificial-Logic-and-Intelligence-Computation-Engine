name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - name: Ruff (hata kuralları)
        run: ruff check alice tests evals
      - name: Derleme (SyntaxWarning dahil hata sayılır)
        run: python -W error -m compileall -q alice tests evals

  # Type checking, one package at a time (#229): the packages listed under [tool.pyright] include in pyproject.toml.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pyright==1.1.414"
      - run: pyright

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The suite takes 3-5 minutes; a hung test would otherwise hold the job for the 6-hour limit.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov
      # Testler paralel (pytest-xdist, makinedeki çekirdek sayısı kadar işçi). Kapsam ölçümü testleri yavaşlatır;
      # sadece raporu yüklenen işte açık.
      - name: Testler
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.13') }}
        run: python -m pytest -q -n auto --durations=25
      - name: Testler (kapsamla)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m pytest -q -n auto --durations=25 --cov=alice --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  # Coverage badge (#228): on every push to main, the coverage rate from the Python 3.13 test job is written as a
  # shields.io endpoint file (coverage.json) to this repo's own `coverage-badge` branch, with the built-in token.
  # No external service, secret or third-party action. The README badge reads that file.
  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the coverage-badge branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: coverage
      - name: Publish the badge data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          python .github/scripts/coverage_badge.py coverage.xml "$RUNNER_TEMP/badge"
          cd "$RUNNER_TEMP/badge"
          git init -q -b coverage-badge
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Coverage for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" coverage-badge

  # The Linux install the README tells people to run, on a clean Ubuntu.
  linux-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the piped run below clones this repo, so it needs the real history and the PR's commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The one-liner path: the script arrives on stdin (`curl ... | bash`), from a folder that is not a clone, and
      # clones into a relative --dir. Pointed at this checkout so the PR's own code is what gets cloned.
      - name: Piped install (curl | bash path)
        run: |
          set -e
          git -C "$GITHUB_WORKSPACE" branch -f ci-install HEAD
          mkdir -p "$RUNNER_TEMP/elsewhere" && cd "$RUNNER_TEMP/elsewhere"
          ALICE_REPO_URL="file://$GITHUB_WORKSPACE" ALICE_REF=ci-install \
            bash -s -- --dir piped-alice < "$GITHUB_WORKSPACE/install.sh"
          test -x "$RUNNER_TEMP/elsewhere/piped-alice/.venv/bin/alice"
          test "$(git -C "$RUNNER_TEMP/elsewhere/piped-alice" branch --show-current)" = main
          # ~/.local/bin/alice must be an absolute link that works from anywhere.
          case "$(readlink "$HOME/.local/bin/alice")" in /*) ;; *) echo "relative symlink"; exit 1 ;; esac
          cd / && "$HOME/.local/bin/alice" --version
          bash -s -- --help < "$GITHUB_WORKSPACE/install.sh" | grep -q 'curl -fsSL'
      # A run from inside a clone installs that clone. The piped install above recorded its own venv first, so this
      # also checks the launcher follows the newest install instead of a Python recorded earlier.
      - name: install.sh in a clone
        run: bash install.sh
      - name: Check the install
        run: |
          set -e
          "$HOME/.local/bin/alice" --version
          test "$(readlink "$HOME/.local/bin/alice")" = "$GITHUB_WORKSPACE/.venv/bin/alice"
          grep -q "^Exec=$GITHUB_WORKSPACE/.venv/bin/python -m alice app" "$HOME/.local/share/applications/alice.desktop"
          test -f "$HOME/.local/share/applications/alice.desktop"
          grep -q -- '-m alice app' "$HOME/.local/share/applications/alice.desktop"
          test -f "$HOME/.alice/config.toml"
      - name: Re-running install.sh is safe
        run: |
          set -e
          grep -q '"pending"' "$HOME/.alice/setup.json"
          # A finished wizard must stay finished when the script runs again (repair, or the curl line once more).
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "from alice.features import set_wizard_state; set_wizard_state(wizard='done')"
          bash install.sh --no-shortcut
          grep -q '"done"' "$HOME/.alice/setup.json"
          "$HOME/.local/bin/alice" --version
      - name: Output is short and the next terminal finds `alice`
        run: |
          set -e
          # GitHub runners already have ~/.local/bin on PATH; a fresh desktop login does not, so drop it here.
          clean_path="$(printf '%s' "$PATH" | tr ':' '\n' | grep -vx "$HOME/.local/bin" | paste -sd: -)"
          out="$(PATH="$clean_path" bash install.sh --no-shortcut 2>&1)"
          echo "$out"
          PATH="$clean_path" bash install.sh --no-shortcut >/dev/null 2>&1  # twice: the rc line is added once
          # pip/setuptools deprecation boxes go to install.log, not the terminal
          ! echo "$out" | grep -q 'BuildBackendWarning'
          grep -q '# added by the ALICE installer' "$HOME/.bashrc"
          test "$(grep -c '# added by the ALICE installer' "$HOME/.bashrc")" = 1  # idempotent
          env -i HOME="$HOME" bash -ic 'command -v alice' | grep -q "$HOME/.local/bin/alice"

  # A fresh desktop Ubuntu/Mint: system Python without venv, no git. Every missing package must be named in ONE
  # copy-pasteable command (people ran the script three times and copied "Install it:" as a command).
  linux-install-bare:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Bare system
        run: apt-get update -qq && apt-get install -y -qq python3 curl >/dev/null
      - uses: actions/checkout@v7
      - name: Missing packages are listed once
        run: |
          set +e
          out="$(bash -s < install.sh 2>&1)"; code=$?
          set -e
          echo "$out"
          test "$code" = 1
          line="$(echo "$out" | grep -E '^ +sudo apt-get install -y ')"
          echo "$line" | grep -q python3-venv
          echo "$line" | grep -q ' git'
          ! echo "$out" | grep -q 'Install it:'
      - name: After installing them, the same line works
        run: |
          apt-get install -y -qq python3-venv python3.12-venv git >/dev/null
          git config --global --add safe.directory '*'
          # checkout had no git in this container, so it downloaded a tarball: make it a repo to clone from.
          cd "$GITHUB_WORKSPACE"
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm ci
          git branch -f ci-install HEAD
          cd /tmp
          ALICE_REPO_URL="file://$GITHUB_WORKSPACE" ALICE_REF=ci-install bash -s < "$GITHUB_WORKSPACE/install.sh" 2>&1 | tee out.txt
          ! grep -q 'ayrık HEAD\|detached HEAD' out.txt
          "$HOME/.local/bin/alice" --version
