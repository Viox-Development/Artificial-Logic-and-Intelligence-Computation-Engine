title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea! Rough ideas are welcome: you don't need a design or a use case written up.
        Others can upvote and discuss it; ideas that get traction become issues.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like ALICE to do, or do differently?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help (optional)
      description: When would you use it? What do you do today instead?
